apiVersion: v1
kind: Namespace
metadata:
  name: bookworm
---
# ── PostgreSQL Deployment ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookworm-db
  namespace: bookworm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookworm-db
  template:
    metadata:
      labels:
        app: bookworm-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookworm-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: "bookworm"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: bookworm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookworm-db
  namespace: bookworm
spec:
  selector:
    app: bookworm-db
  ports:
    - port: 5432
      targetPort: 5432
---
# ── Backend API Deployment ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookworm-api
  namespace: bookworm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookworm-api
  template:
    metadata:
      labels:
        app: bookworm-api
    spec:
      containers:
        - name: bookworm-api
          image: us.icr.io/bookworm/bookworm-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: "bookworm-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "bookworm"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookworm-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookworm-secrets
                  key: jwt-secret
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: bookworm-api
  namespace: bookworm
spec:
  selector:
    app: bookworm-api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bookworm-api
  namespace: bookworm
spec:
  to:
    kind: Service
    name: bookworm-api
  port:
    targetPort: 3001
  tls:
    termination: edge
---
# ── Frontend Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookworm-frontend
  namespace: bookworm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookworm-frontend
  template:
    metadata:
      labels:
        app: bookworm-frontend
    spec:
      containers:
        - name: nginx
          image: us.icr.io/bookworm/bookworm-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bookworm-frontend
  namespace: bookworm
spec:
  selector:
    app: bookworm-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bookworm-frontend
  namespace: bookworm
spec:
  to:
    kind: Service
    name: bookworm-frontend
  port:
    targetPort: 80
  tls:
    termination: edge
