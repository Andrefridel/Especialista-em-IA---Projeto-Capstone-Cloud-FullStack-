openapi: 3.0.3
info:
  title: BookWorm E-Bookstore API
  description: REST API for the BookWorm e-commerce platform to view, browse and purchase books.
  version: 1.0.0
  contact:
    name: BookWorm API Support

servers:
  - url: http://localhost:3001/api
    description: Local development server

tags:
  - name: Auth
    description: User authentication and registration
  - name: Books
    description: Book catalogue and product details
  - name: Categories
    description: Book categories and brands
  - name: Cart
    description: Shopping cart management
  - name: Orders
    description: Order management and history
  - name: Checkout
    description: Payment and checkout process
  - name: Reviews
    description: Book reviews and ratings
  - name: Users
    description: User profile and addresses

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  # ── CATEGORIES ────────────────────────────────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: List all book categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /categories/{id}/books:
    get:
      tags: [Categories]
      summary: Get books by category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: brand
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Books in category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'

  # ── BOOKS ─────────────────────────────────────────────────────────────
  /books:
    get:
      tags: [Books]
      summary: Search and filter books
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: category
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [Paperback, Hardcover, eBook]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest]
      responses:
        '200':
          description: Books matching search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'

  /books/recommended:
    get:
      tags: [Books]
      summary: Get recommended books for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recommended books based on order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/bestsellers:
    get:
      tags: [Books]
      summary: Get bestsellers this month
      responses:
        '200':
          description: Bestseller books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/new-launches:
    get:
      tags: [Books]
      summary: Get newly launched books
      responses:
        '200':
          description: New launch books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/{id}:
    get:
      tags: [Books]
      summary: Get book details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          description: Book not found

  /books/{id}/related:
    get:
      tags: [Books]
      summary: Get related books
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  # ── REVIEWS ───────────────────────────────────────────────────────────
  /books/{id}/reviews:
    get:
      tags: [Reviews]
      summary: Get reviews for a book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of reviews
    post:
      tags: [Reviews]
      summary: Submit a review for a book
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review submitted

  # ── CART ──────────────────────────────────────────────────────────────
  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    post:
      tags: [Cart]
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Item added to cart

  /cart/{itemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Cart updated
    delete:
      tags: [Cart]
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed

  # ── ORDERS ────────────────────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: Get user order history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
    delete:
      tags: [Orders]
      summary: Cancel order (within 48 hours)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order cancelled
        '400':
          description: Cannot cancel after 48 hours

  # ── CHECKOUT ──────────────────────────────────────────────────────────
  /checkout:
    post:
      tags: [Checkout]
      summary: Create order from cart (checkout)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created, payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'

  /checkout/payment:
    post:
      tags: [Checkout]
      summary: Process payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Payment failed

  /checkout/apply-coupon:
    post:
      tags: [Checkout]
      summary: Apply coupon code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Coupon applied

  # ── USERS ─────────────────────────────────────────────────────────────
  /users/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile

  /users/addresses:
    get:
      tags: [Users]
      summary: Get saved addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of addresses
    post:
      tags: [Users]
      summary: Add new address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address added

  /users/gift-points:
    get:
      tags: [Users]
      summary: Get user gift points balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gift points balance

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [guest, registered]
        giftPoints:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        price:
          type: number
        format:
          type: string
        tags:
          type: array
          items:
            type: string
        deliveryDate:
          type: string
        coverColor:
          type: string
        sells:
          type: integer

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            description:
              type: string
            publishedBy:
              type: string
            language:
              type: string
            rating:
              type: number
            aboutAuthor:
              type: string
            isbn:
              type: string

    BookListResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'

    ReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 100

    CartItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              book:
                $ref: '#/components/schemas/Book'
              quantity:
                type: integer
        total:
          type: number

    Address:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        addressLine:
          type: string
        city:
          type: string
        pin:
          type: string
        state:
          type: string
        country:
          type: string
        phone:
          type: string
        email:
          type: string

    CheckoutRequest:
      type: object
      required: [address]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        useSavedAddress:
          type: boolean
        couponCode:
          type: string
        redeemGiftPoints:
          type: boolean

    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: integer
        payableAmount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'

    PaymentRequest:
      type: object
      required: [orderId, method]
      properties:
        orderId:
          type: integer
        method:
          type: string
          enum: [credit_card, debit_card, upi, wallet]
        cardNumber:
          type: string
        nameOnCard:
          type: string
        cvv:
          type: string
        expiryDate:
          type: string
        upiId:
          type: string

    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        orderId:
          type: integer
        transactionId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'

    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        total:
          type: number
        canCancel:
          type: boolean
