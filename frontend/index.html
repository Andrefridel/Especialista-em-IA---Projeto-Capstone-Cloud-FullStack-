<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookWorm — Login</title>
  <link rel="stylesheet" href="src/styles/global.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">📚 Book Worm</div>
    <div class="login-subtitle">Sign in to your account</div>

    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" value="demo@bookworm.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" value="password123">
      </div>
      <div id="loginError" class="form-error" style="display:none;margin-bottom:12px;"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Sign In</button>
      <div class="login-divider">or</div>
      <button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="guestLogin()">Continue as Guest</button>
      <p style="text-align:center;margin-top:16px;font-size:12px;color:#888;">
        Don't have an account? <a href="#" onclick="showRegister()">Register</a>
      </p>
    </div>

    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" id="reg-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="reg-password" placeholder="Min 6 characters">
      </div>
      <div id="regError" class="form-error" style="display:none;margin-bottom:12px;"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doRegister()">Create Account</button>
      <p style="text-align:center;margin-top:16px;font-size:12px;color:#888;">
        Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
      </p>
    </div>
  </div>
</div>

<script src="src/pages/api.js"></script>
<script>
  // If already logged in, redirect to home
  if (localStorage.getItem('bw_token')) {
    window.location.href = 'home.html';
  }

  function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
  }
  function showLogin() {
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
  }

  async function doLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    try {
      const data = await API.login(email, password);
      localStorage.setItem('bw_token', data.token);
      localStorage.setItem('bw_user', JSON.stringify(data.user));
      window.location.href = 'home.html';
    } catch (e) {
      errEl.textContent = e.message || 'Login failed';
      errEl.style.display = 'block';
    }
  }

  async function doRegister() {
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const errEl = document.getElementById('regError');
    errEl.style.display = 'none';
    try {
      const data = await API.register(name, email, password);
      localStorage.setItem('bw_token', data.token);
      localStorage.setItem('bw_user', JSON.stringify(data.user));
      window.location.href = 'home.html';
    } catch (e) {
      errEl.textContent = e.message || 'Registration failed';
      errEl.style.display = 'block';
    }
  }

  function guestLogin() {
    localStorage.setItem('bw_user', JSON.stringify({ name: 'Guest', role: 'guest' }));
    window.location.href = 'home.html';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (document.getElementById('registerForm').style.display !== 'none') doRegister();
      else doLogin();
    }
  });
</script>
</body>
</html>
