<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookWorm — Purchase Confirmed</title>
  <link rel="stylesheet" href="src/styles/global.css">
</head>
<body>
<div id="navbar"></div>
<div class="confirm-page">
  <!-- Decorative background (same as payment page) -->
  <div class="payment-bg-deco">
    <div style="position:absolute;width:120px;height:160px;background:#c1440e;top:60px;left:18%;transform:rotate(-15deg);border-radius:6px;opacity:0.6;"></div>
    <div style="position:absolute;width:80px;height:110px;background:#1a4a6e;top:30%;right:20%;border-radius:6px;opacity:0.6;"></div>
    <div style="position:absolute;width:100px;height:140px;background:#e85d04;bottom:100px;left:10%;transform:rotate(10deg);border-radius:6px;opacity:0.6;"></div>
    <div style="position:absolute;width:130px;height:90px;background:#f4a261;bottom:80px;right:15%;transform:rotate(-8deg);border-radius:6px;opacity:0.5;"></div>
    <svg style="position:absolute;bottom:120px;left:22%;opacity:0.3;" width="200" height="60" viewBox="0 0 200 60">
      <path d="M0 30 Q25 0 50 30 Q75 60 100 30 Q125 0 150 30 Q175 60 200 30" stroke="#c9a84c" stroke-width="3" fill="none"/>
    </svg>
  </div>

  <div class="confirm-modal">
    <div class="confirm-icon">✓</div>
    <div class="confirm-title">Your purchase of the<br>following reads is successful</div>

    <div class="confirm-books" id="confirmedBooks"></div>

    <div id="transactionInfo" style="font-size:12px;color:#888;margin-bottom:20px;"></div>

    <button class="btn btn-primary" onclick="window.location.href='home.html'" style="justify-content:center;gap:8px;">
      Continue your Shopping 🛒
    </button>
  </div>
</div>
<footer style="position:relative;z-index:2;">© 2025 BookWorm — An IBM Agentic IDE Demo Project</footer>

<script src="src/pages/api.js"></script>
<script>
  document.getElementById('navbar').innerHTML = renderNavbar('');

  const orderData = JSON.parse(localStorage.getItem('bw_last_order') || '{}');
  const pendingOrder = JSON.parse(localStorage.getItem('bw_pending_order') || '{}');
  const items = orderData.items || pendingOrder.items || [];
  // teste
  // Clear pending order
  localStorage.removeItem('bw_pending_order');
  // Clear cart
  Cart.save([]);
  Cart.updateBadge();

  if (orderData.transactionId) {
    document.getElementById('transactionInfo').textContent =
      `Order #${orderData.orderId || 'N/A'} • Transaction: ${orderData.transactionId}`;
  }

  const confirmedBooks = document.getElementById('confirmedBooks');
  if (items.length > 0) {
    confirmedBooks.innerHTML = items.map(item => `
      <div class="confirm-book-item">
        <div style="width:70px;min-width:70px;height:95px;background:${item.cover_color || item.cover_color || '#333'};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;text-align:center;padding:6px;text-transform:uppercase;">${item.title}</div>
        <div>
          <div style="font-size:13px;font-weight:600;margin-bottom:2px;">${item.title}</div>
          <div style="font-size:11px;color:#4da6ff;margin-bottom:4px;">by <a href="#">${item.author}</a></div>
          <div style="font-size:11px;color:#888;margin-bottom:6px;">${item.description || ''}</div>
          <div style="font-size:11px;color:#888;margin-bottom:4px;">${item.format || 'Paperback'}</div>
          <div style="font-size:11px;color:#4da6ff;">${(item.tags || []).join(', ')}</div>
          <div style="font-size:14px;font-weight:700;">₹${item.price || item.book_price || ''}</div>
          <div style="font-size:11px;color:#888;">Delivery by ${item.delivery_date || 'Mon, 21 Jul'}</div>
        </div>
      </div>`).join('');
  } else {
    confirmedBooks.innerHTML = '<p style="color:#888;font-size:13px;">Your order has been placed successfully!</p>';
  }
</script>
</body>
</html>
